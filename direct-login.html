<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تسجيل الدخول - moadbook</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(145deg,#f5f3ff,#fff4f7);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#262641}.card{width:min(430px,100%);background:#fff;border:1px solid #e8e4f5;border-radius:26px;padding:25px;box-shadow:0 20px 60px #332c6c22}.brand{text-align:center;color:#5147d9;font-size:25px;font-weight:950;margin-bottom:5px}.sub{text-align:center;color:#777994;font-size:13px;margin:0 0 20px}.field{display:block;width:100%;border:1px solid #dedced;border-radius:13px;padding:13px;margin:9px 0;background:#fcfcff;font:inherit;outline:none}.field:focus{border-color:#7265dd;box-shadow:0 0 0 3px #7265dd18}.btn{width:100%;border:0;border-radius:13px;padding:13px;margin-top:9px;font:inherit;font-weight:800;cursor:pointer}.primary{background:linear-gradient(110deg,#5147d9,#a248d5);color:#fff}.google{background:#fff;border:1px solid #ddd9ec;color:#383653}.status{min-height:24px;margin-top:14px;text-align:center;font-size:12px;line-height:1.7;color:#5a56a1}.error{color:#c33e5d}.hint{text-align:center;color:#8b8ca2;font-size:11px;margin-top:15px;line-height:1.7}</style></head><body><main class="card"><div class="brand">moadbook</div><p class="sub">تسجيل دخول مباشر وآمن</p><form id="form"><input id="identity" class="field" autocomplete="username" placeholder="اسم المستخدم أو البريد الإلكتروني" required><input id="password" class="field" type="password" autocomplete="current-password" placeholder="كلمة المرور" required><button id="submit" class="btn primary">تسجيل الدخول</button></form><button id="google" class="btn google">المتابعة باستخدام Google</button><div id="status" class="status"></div><p class="hint">لن يتم حذف أو تعديل أي منشور أو محادثة. هذه الصفحة تتجاوز شاشة الترحيب فقط.</p></main><script src="./firebase-config.js"></script><script src="https://www.gstatic.com/firebasejs/13.1.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/13.1.0/firebase-auth-compat.js"></script><script src="./google-auth.js?direct=1"></script><script>
const cfg=window.MOADBOOK_FIREBASE||{},$=id=>document.getElementById(id),status=(t,e)=>{$('status').textContent=t;$('status').className='status'+(e?' error':'')};
function save(data,identity){const raw=JSON.stringify({idToken:data.idToken,refreshToken:data.refreshToken,expiresAt:Date.now()+Number(data.expiresIn||3600)*1000,lastActiveAt:Date.now(),user:{id:data.localId||data.user_id,email:data.email||'',username:identity||data.email||'',displayName:data.displayName||identity||data.email||'',photoUrl:data.photoUrl||''}});localStorage.setItem('moadbook-web-session-v2',raw);try{window.MoadbookSecureStore?.save?.(raw)}catch(e){}location.replace('./index.html?authenticated='+Date.now())}
async function api(action,payload){const c=new AbortController(),timer=setTimeout(()=>c.abort(),15000);try{const r=await fetch('https://identitytoolkit.googleapis.com/v1/accounts:'+action+'?key='+encodeURIComponent(cfg.apiKey),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload),signal:c.signal}),d=await r.json().catch(()=>null);if(!r.ok)throw new Error(d?.error?.message||'HTTP_'+r.status);return d}catch(e){if(e.name==='AbortError')throw new Error('TIMEOUT');throw e}finally{clearTimeout(timer)}}
function message(e){const c=String(e.message||e).toUpperCase();if(c.includes('INVALID_LOGIN'))return 'اسم المستخدم أو البريد الإلكتروني أو كلمة المرور غير صحيحة.';if(c.includes('TIMEOUT'))return 'انتهت مهلة الاتصال. تحقق من الإنترنت وحاول مجددًا.';if(c.includes('USER_DISABLED'))return 'هذا الحساب موقوف.';return 'تعذر تسجيل الدخول: '+c}
$('form').onsubmit=async e=>{e.preventDefault();$('submit').disabled=true;status('جارٍ التحقق…');const raw=$('identity').value.trim().toLowerCase(),email=raw.includes('@')?raw:(/^[a-z0-9_]{3,24}$/.test(raw)?raw+'@accounts.example.com':'');try{if(!email)throw new Error('استخدم اسم المستخدم أو البريد الإلكتروني');save(await api('signInWithPassword',{email,password:$('password').value,returnSecureToken:true}),raw)}catch(err){status(message(err),true);$('submit').disabled=false}};
$('google').onclick=async()=>{try{$('google').disabled=true;status('جارٍ فتح Google…');const d=await window.MoadbookGoogleAuth.signIn();if(d?.idToken)save(d,d.email||d.displayName)}catch(e){status(message(e),true);$('google').disabled=false}};
(async()=>{try{const d=await window.MoadbookGoogleAuth?.consumeRedirect?.();if(d?.idToken)save(d,d.email||d.displayName)}catch(e){status(message(e),true)}})();
</script></body></html>
